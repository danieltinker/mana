# Every push to main builds the whole site (tools/build-site.sh) and publishes it to GitHub Pages:
# https://danieltinker.github.io/mana/, which halom.io serves at /mana/ and /m/<name>.
# A push to main is therefore a release: it changes every restaurant's menu.
# Repository settings: Pages → Build and deployment → Source: "GitHub Actions". Custom domain: empty.
name: Publish Mana

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job only reads (the code, and the Pages settings configure-pages needs); only the deploy job may write to
# Pages, and only from main.
permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build the site
        run: bash tools/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
